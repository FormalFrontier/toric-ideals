name = "toric-ideals"
version = "0.1.0"
lintDriver = "batteries/runLinter"
defaultTargets = ["ToricIdeals", "ToricIdealsTest", "ToricIdealsModelTests", "ToricIdealsKernelTests"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "multivariate-polynomials"
git = "https://github.com/FormalFrontier/multivariate-polynomials.git"
rev = "616945c1c06d1655887100fe8a40e06a4a4a6d76"

[[require]]
name = "minimal-primes"
git = "https://github.com/FormalFrontier/minimal-primes.git"
rev = "537058e2a3f4610d3126f22af057a1f6cd96c886"

[[require]]
name = "integral-closure"
git = "https://github.com/FormalFrontier/integral-closure.git"
rev = "3e89fa94dfa32e9d4f4c43fca8dd15462686201c"

[[require]]
name = "coherent-modules"
git = "https://github.com/FormalFrontier/coherent-modules.git"
rev = "b9bb233399aab0f864a2a1a1bb3d414dff530812"

[[require]]
name = "groupTheory"
git = "https://github.com/FormalFrontier/group-theory.git"
rev = "07948c9888686ade711654c1433c3efb2652e1aa"

[[require]]
name = "group-rings"
git = "https://github.com/FormalFrontier/group-rings.git"
rev = "8a10fb8c1285227a36501fa50206a0bed05fc98a"

[[lean_lib]]
name = "ToricIdeals"
roots = ["ToricIdeals", "ToricIdeals.MonoidAlgebra.MonomialSubalgebra",
  "ToricIdeals.MonoidAlgebra.FiberNormalization",
  "ToricIdeals.Polynomial.MonomialFractionField", "ToricIdeals.Polynomial.MonomialFinite",
  "ToricIdeals.Polynomial.MonomialTotalQuotient"]

[[lean_lib]]
name = "ToricIdealsTest"
roots = ["ToricIdealsTest.ArithmeticConductor",
  "ToricIdealsTest.FiberNormalizationExamples", "ToricIdealsTest.FiberNormalizationClient",
  "ToricIdealsTest.PolynomialConductor",
  "ToricIdealsTest.RationalNormalCurveDomainModels",
  "ToricIdealsTest.RationalNormalCurveCoordinateLocalization",
  "ToricIdealsTest.RationalNormalCurveReducedModels",
  "ToricIdealsTest.MonomialFractionField",
  "ToricIdealsTest.MonomialFinite", "ToricIdealsTest.MonomialTotalQuotient"]

[[lean_lib]]
name = "ToricIdealsKernelTests"
roots = ["ToricIdealsTest.ReadmeKernel"]

[lean_lib.leanOptions]
weak.linter.privateModule = false

# Keep this library last so these selected verification modules use test options.
# The private Artinian and coefficient-algebra models are verification modules,
# unlike the public examples in ToricIdealsTest. All remain in default builds.
# The globs build individual modules; the root prefixes also claim descendants,
# so recheck ownership if these selected modules gain submodules.
