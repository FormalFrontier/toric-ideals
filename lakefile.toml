name = "toric-ideals"
version = "0.1.0"
defaultTargets = ["ToricIdeals", "ToricIdealsTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"

[[require]]
name = "multivariate-polynomials"
git = "https://github.com/FormalFrontier/multivariate-polynomials.git"
rev = "1d35a823d61bc2edee63a3c76d6e009dc9245fa3"

[[lean_lib]]
name = "ToricIdeals"

[[lean_lib]]
name = "ToricIdealsTest"
roots = ["ToricIdealsTest.Audit", "ToricIdealsTest.RootClient", "ToricIdealsTest.ReadmeKernel",
  "ToricIdealsTest.FiberNormalizationExamples", "ToricIdealsTest.FiberNormalizationClient",
  "ToricIdealsTest.RationalNormalCurveDomainModels",
  "ToricIdealsTest.RationalNormalCurveInjectivityModels",
  "ToricIdealsTest.RationalNormalCurveSemiringInjectivityModels",
  "ToricIdealsTest.RationalNormalCurveAugmentationModels",
  "ToricIdealsTest.RationalNormalCurveAugmentationNilpotentModels",
  "ToricIdealsTest.RationalNormalCurveCoordinateRegularityModels",
  "ToricIdealsTest.RationalNormalCurveCoordinateLocalization",
  "ToricIdealsTest.RationalNormalCurveExponentImageModels",
  "ToricIdealsTest.RationalNormalCurveExponentImageClient",
  "ToricIdealsTest.RationalNormalCurveReducedModels",
  "ToricIdealsTest.RationalNormalCurveHomogeneityModels",
  "ToricIdealsTest.RationalNormalCurveHomogeneityClient",
  "ToricIdealsTest.RationalNormalCurveJacobsonModels",
  "ToricIdealsTest.RationalNormalCurveJacobsonClient",
  "ToricIdealsTest.RationalNormalCurveNoetherianModels",
  "ToricIdealsTest.RationalNormalCurveNoetherianNegativeModels",
  "ToricIdealsTest.RationalNormalCurveArtinianModels",
  "ToricIdealsTest.SplitQuadricModels",
  "ToricIdealsTest.RationalNormalCurveBaseChangeSmallModels",
  "ToricIdealsTest.RationalNormalCurveBaseChangeNonflatModels",
  "ToricIdealsTest.RationalNormalCurveBaseChangeTensorModels",
  "ToricIdealsTest.RationalNormalCurveCoefficientModules",
  "ToricIdealsTest.RationalNormalCurve.EndpointMap",
  "ToricIdealsTest.CoefficientAlgebraModels",
  "ToricIdealsTest.CoefficientAlgebraUses",
  "ToricIdealsTest.ParametrizationFiniteModels",
  "ToricIdealsTest.ParametrizationFiniteClients",
  "ToricIdealsTest.SplitQuadricExamples",
  "ToricIdealsTest.SplitQuadricRootClient",
  "ToricIdealsTest.RationalNormalCurveDimensionBaseCases"]
