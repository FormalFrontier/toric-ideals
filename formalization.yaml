version: "v0.4"

project:
  name: "Toric Ideals"
  description: >-
    Reusable Lean theory of coefficientwise fiber normalization over arbitrary
    rings, its kernel and ideal-membership criteria for additive monoid
    algebras, and the Hankel-minor presentation of the degree-n rational
    normal curve's monomial-map kernel for positive n over arbitrary commutative
    rings, with low-degree boundaries, a quotient-to-image equivalence,
    domain-dependent consequences, all-degree standard-graded homogeneity of
    the original Hankel ideal, all-degree coefficient criteria for domain,
    reduced and Noetherian Hankel quotient rings, the all-degree criterion
    that the Hankel quotient is Artinian over itself exactly for zero
    coefficient rings, and an arithmetic
    characterization of the natural exponent image in every degree.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Almanac (Formal Frontier)"
  license: "Apache-2.0"

sources:
  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - "Ravi Vakil"
    type: "book"
    location: "Exercise 3.6.F"
    relationship: "adapts"
    note: >-
      October 21, 2025 draft. Motivation for the Hankel-minor and
      rational-normal-curve parametrization.
      The project adapts its own earlier source-research definitions and descent
      argument; no book material is reproduced, and no author participation or
      endorsement is claimed. This library does not formalize the book as a whole.
  - title: "Fiberwise kernel normalization, terminal-exponent uniqueness and exponent images"
    type: "original-proof"
    relationship: "independently-proves"
    note: >-
      Later original Formal Frontier proof work establishes coefficientwise
      normalization, terminal-exponent uniqueness, the reverse Hankel-ideal
      inclusion and the arithmetic exponent-image criterion, distinct from
      the adapted source-research descent argument.

status:
  scope: >-
    The generic coefficientwise normalization principle for arbitrary index
    functions, its kernel criteria for additive exponent homomorphisms between
    additive monoids over any ring, and the specified Hankel-minor
    presentation, degree-zero and degree-one boundaries, quotient-to-image
    equivalence, domain-dependent prime/spectrum results, and coefficient
    criteria for primality, reducedness, radicality and Noetherianity in every
    degree. For every (R : Type u) [CommRing R] and n : ℕ,
    quotient_isArtinianRing_iff states that the Hankel quotient is Artinian
    as a module over itself if and only if Subsingleton R. Finite nonzero
    Artinian coefficients alone do not imply an Artinian quotient.
    The original Hankel ideal is homogeneous for Mathlib's canonical
    natural-number grading of the source polynomial ring for every
    (R : Type u) [CommRing R] and n : ℕ, including zero rings and n = 0, 1.
    ToricIdeals.RationalNormalCurve.ExponentImage provides
    mem_mrange_rncExponent_iff: for every n : ℕ and t : Fin 2 →₀ ℕ,
    membership in AddMonoidHom.mrange (rncExponent n) is equivalent to
    n dividing t 0 + t 1. The degree-zero image is the zero exponent.
    ToricIdealsTest.RationalNormalCurveExponentImageModels gives independent
    small-degree image and exclusion examples.
    ToricIdealsTest.RationalNormalCurveExponentImageClient provides
    fiberNormalExponent_normal_and_image_of_dvd: for 1 ≤ n and any target
    satisfying divisibility, fiberNormalExponent ℤ n t is Normal and maps
    back to t, with the mixed cubic family (4m+2, 2m+1) as an example.
    No quotient grading, rank or Hilbert-function formula, general
    classification of toric ideals or whole-source coverage is asserted.

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        AI-assisted Lean development in a pinned Lean 4 and mathlib Lake project.
  notes: >-
    AI agents developed the mathematical code and documentation, with independent
    agent review of the mathematics. Atlas assembled the named README example and
    native Markdown reference using a recipe adapted from Anchor's original
    ideal-completion tooling through integral-closure and minimal-primes.
    No model, cost, benchmark comparison or human-review claim is made here.

fidelity:
  divergences: >-
    Coefficientwise normalization needs neither coefficient nor exponent
    commutativity; its arbitrary-function form asserts membership of elements
    with vanishing fiber sums, not multiplicativity. Kernel equality for additive
    exponent homomorphisms separately requires the ideal to lie in the kernel.
    The curve kernel equality generalizes the motivating example to arbitrary
    commutative coefficient rings for positive n. Domain and irreducible-spectrum
    consequences require a domain; the degree-zero equality fails for nontrivial
    rings. The all-degree coefficient criteria concern the quotient by the
    Hankel ideal itself; at degree zero this is the full one-variable
    polynomial quotient by the zero ideal, not the parametrization kernel or
    image. The Artinian criterion concerns the quotient as a module over
    itself, not over its coefficient ring; it is equivalent to the coefficient
    ring being a zero ring, not merely Artinian. It includes nilpotent and
    product coefficients and the full degree-zero and degree-one polynomial
    quotients. Standard-graded homogeneity also concerns the original Hankel ideal
    in every degree: n = 0 has one source variable and ideal zero, while n = 1
    has two source variables and ideal zero. It requires no nontriviality,
    domain, field, reducedness or positive-degree assumption, and a minor's
    homogeneous degree label two does not imply total degree two for a zero
    polynomial. The exponent-image criterion has no coefficient-ring or
    positive-degree premise. The selector client requires 1 ≤ n because it
    uses the existing fiber-selection law, and specializes its inherited
    commutative coefficient-ring parameter to ℤ; it requires no supplied
    source preimage, domain or field hypothesis.
    The positive-degree image equivalence is an equivalence of rings,
    not a scheme isomorphism or a classification of toric ideals.

review:
  status: "agent-reviewed mathematical development"
  notes: >-
    The mathematical code and module/test interfaces received independent agent
    review.

acknowledgements: >-
  The project depends on mathlib without bundling it. Ravi Vakil's exercise is
  mathematical motivation and does not imply participation or endorsement.
  Atlas added the native example and Markdown reference using a recipe adapted
  from Anchor's original project documentation work. Lean and doc-gen4 are
  separately credited tools, not bundled documentation or source material.
