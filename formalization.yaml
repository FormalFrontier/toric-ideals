version: "v0.4"

project:
  name: "Toric Ideals"
  description: >-
    Reusable Lean theory of coefficientwise fiber normalization for additive
    monoid algebras and the Hankel-minor presentation of the degree-n rational
    normal curve's monomial-map kernel for positive n over arbitrary commutative
    rings, with low-degree boundaries, a quotient-to-image equivalence and
    domain-dependent consequences.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Atlas (Formal Frontier)"
  license: "Apache-2.0"

sources:
  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - "Ravi Vakil"
    type: "book"
    location: "Exercise 3.6.F"
    relationship: "adapts"
    note: >-
      October 21, 2025 draft. Motivation for the Hankel-minor and
      rational-normal-curve parametrization.
      The project adapts its own earlier source-research definitions and descent
      argument; no book material is reproduced, and no author participation or
      endorsement is claimed. This library does not formalize the book as a whole.
  - title: "Fiberwise kernel normalization and terminal-exponent uniqueness"
    type: "original-proof"
    relationship: "independently-proves"
    note: >-
      Later original Formal Frontier proof work establishes coefficientwise
      normalization, terminal-exponent uniqueness and the reverse Hankel-ideal
      inclusion, distinct from the adapted source-research descent argument.

status:
  scope: >-
    The generic coefficientwise kernel principle and the specified Hankel-minor
    presentation, degree-zero and degree-one boundaries, quotient-to-image
    equivalence and domain-dependent prime/spectrum results. No general
    classification of toric ideals or whole-source coverage is asserted.

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        Formal Frontier agent-managed Lean development in a pinned Lean 4 and
        mathlib Lake project, with Git-recorded contributions and separate
        independent agent review of accepted mathematical changes.
  notes: >-
    AI agents developed and independently reviewed the integrated mathematical
    code and earlier standalone documentation. Atlas assembled the named README
    example and native Markdown reference using a recipe adapted from Anchor's
    original ideal-completion tooling through integral-closure and minimal-primes.
    No model, cost, benchmark comparison or human-review claim is made here.

fidelity:
  divergences: >-
    The curve kernel equality generalizes the motivating example to arbitrary
    commutative coefficient rings for positive n. Domain and irreducible-spectrum
    consequences require a domain; the degree-zero equality fails for nontrivial
    rings. The library concerns the quotient's image subring, not a scheme
    isomorphism or a classification of toric ideals.

review:
  status: "agent-reviewed mathematical development"
  notes: >-
    Mathematical development, native module/test interfaces and earlier
    standalone documentation received independent agent review and owner
    acceptance. Historical reviews do not certify later changes; review of the
    present candidate and release acceptance are separate, as is source coverage.

acknowledgements: >-
  The project depends on mathlib without bundling it. Ravi Vakil's exercise is
  mathematical motivation and does not imply participation or endorsement.
  Atlas added the native example and Markdown reference using a recipe adapted
  from Anchor's original project documentation work. Lean and doc-gen4 are
  separately credited tools, not bundled documentation or source material.
