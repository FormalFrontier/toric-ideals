version: "v0.4"

project:
  name: "Toric Ideals"
  description: >-
    Reusable Lean theory of coefficientwise fiber normalization over arbitrary
    rings, its kernel and ideal-membership criteria for additive monoid
    algebras, coprime bivariate natural-weight kernel presentations and
    all-coefficient binomial membership over arbitrary possibly noncommutative
    rings, and the Hankel-minor presentation of the degree-n rational
    normal curve's monomial-map kernel for positive n over arbitrary commutative
    rings, with low-degree boundaries, a quotient-to-image equivalence,
    domain-dependent consequences, all-degree freeness, flatness and faithful
    flatness of the full Hankel quotient for its canonical coefficient action
    over arbitrary commutative rings in all coefficient universes, including
    zero rings and degree zero, all-degree
    standard-graded homogeneity of the original Hankel ideal, explicit bases
    indexed by Fin (n*d+1) and finite coordinates for every degree-d component
    of the full Hankel quotient over arbitrary commutative rings, with basis
    vectors preserved by arbitrary coefficient homomorphisms in independent
    universes, all-degree
    coefficient criteria for domain, reduced, Noetherian and Jacobson Hankel
    quotient rings, the all-degree criterion
    that the Hankel quotient is Artinian over itself exactly for zero
    coefficient rings, finiteness of its canonical coefficient module exactly
    for zero coefficient rings in every degree, and an arithmetic
    characterization of the natural exponent image, full-target raw-map
    surjectivity exactly in degree one or over subsingleton coefficients for
    arbitrary commutative semirings in every degree, finite type of the raw
    parametrization over its full source in every degree, module finiteness
    of its full target over that source exactly when n is nonzero or the
    coefficient semiring is subsingleton, freeness of the full target over
    the full raw-map source exactly in degree one or over subsingleton
    coefficients for arbitrary commutative semirings in every degree, and
    full-source ring-map
    flatness exactly in degree one or over subsingleton coefficients for
    arbitrary commutative rings in every degree, and regularity of every
    coordinate class in every degree, with an injective coordinate-localization
    client over arbitrary commutative rings. The split-quadric coordinate algebra
    has an all-coefficient determinant kernel, an injective quotient parametrization,
    a range equivalence, coefficient domain and primality criteria, and localization
    chart comparisons over arbitrary commutative rings.
  authors:
    - "Formal Frontier Agents"
  responsible_maintainers:
    - "Almanac (Formal Frontier)"
  license: "Apache-2.0"

sources:
  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - "Ravi Vakil"
    type: "book"
    location: "Exercise 3.6.F"
    relationship: "adapts"
    note: >-
      October 21, 2025 draft. Motivation for the Hankel-minor and
      rational-normal-curve parametrization.
      The project uses its own polynomial definitions and descent argument;
      no book material is reproduced, and no author participation or endorsement
      is claimed. The exercise motivates the presentation, not the Jacobson
      quotient criterion. This library does not formalize the book as a whole.
  - title: "Fiberwise normalization, terminal exponents, exponent images and Hankel quotient criteria"
    type: "original-proof"
    relationship: "independently-proves"
    note: >-
      Original Formal Frontier proofs establish coefficientwise normalization,
      terminal-exponent uniqueness, the reverse Hankel-ideal inclusion and the
      arithmetic exponent-image criterion. Coprime weighted-fiber membership
      uses natural-number coprime divisibility and a left-multiple telescoping
      argument in the existing additive monoid algebra. Its kernel presentation
      combines that congruence with imagewise preimage choice and the existing
      coefficientwise normalization theorem; no public selector or global
      target section is constructed. The raw-map surjectivity criterion
      combines that exponent criterion and the coefficient-vanishing API with
      Mathlib's Finsupp coefficient-transport surjectivity and subsingleton-target
      surjectivity. The Jacobson quotient criterion
      follows the library's Noetherian constant-coefficient augmentation
      argument and uses Mathlib's Jacobson polynomial, quotient and surjective
      descent results. The coefficient-module finiteness criterion uses the
      library's coordinate-axis surjection and directly reuses Mathlib's
      polynomial obstruction, surjective-image finiteness and subsingleton-module
      finiteness results. The raw-map flatness classification composes the
      degree-one exponent identity and Hankel-minor vanishing with Mathlib's
      selected-variable polynomial equivalences, monic regularity and
      preservation of regular scalar actions on flat modules. The raw-source
      freeness classification composes the semiring injectivity criterion and
      degree-one map identity with Mathlib's free-module faithfulness, faithful
      algebra-map injectivity, singleton basis and empty basis APIs.
      Coefficient faithful flatness uses the existing coefficient augmentation
      and freeness with Mathlib's nontrivial free-module result, and transport
      from nonempty-index finitely supported functions for zero coefficients.
      Its tensor clients directly reuse Mathlib's faithfully flat injectivity
      reflection and canonical tensor-unit injection. Homogeneous-component
      bases restrict the coefficient parametrization using the original
      exponent-total identity and terminal normalizer, then transport Mathlib's
      supported monomial basis and finite antidiagonal enumeration. The
      one-variable case instead uses the bottom-ideal polynomial quotient.
      Coefficient change of these indexed bases compares independently chosen
      terminal representatives through the Hankel kernel theorem and reuses
      Mathlib's polynomial and quotient homomorphisms.

  - title: "The Rising Sea: Foundations of Algebraic Geometry"
    authors:
      - "Ravi Vakil"
    type: "book"
    location: "Section 4.4"
    relationship: "adapts"
    note: >-
      Motivation for the determinant model wz - xy. The coordinate-algebra results
      use arbitrary commutative coefficient rings, rather than only fields.
      Polynomial evaluation, quotient, localization and domain-transport APIs
      come from Mathlib. The normal-form proof uses this library's coefficientwise
      fiber-normalization theorem; no source text is reproduced.

status:
  scope: >-
    The generic coefficientwise normalization principle for arbitrary index
    functions, its kernel criteria for additive exponent homomorphisms between
    additive monoids over any ring. The coprime weighted-fiber theorem states
    that for every Ring R in any universe, Nat.Coprime a b, and d,e : Fin 2 →₀ ℕ
    satisfying b*d(0)+a*d(1) = b*e(0)+a*e(1), every coefficient c : R gives
    single d c - single e c in the left ideal spanned by X₀^a - X₁^b.
    It includes noncommutative rings, zero rings and coprime zero-weight axes,
    without positivity or nontriviality assumptions.
    ker_mapDomainRingHom_weight_eq_span_of_coprime identifies this span with
    the kernel of the stock mapDomainRingHom for the stock Finsupp.weight
    with natural weights (b,a). Its characteristic membership theorem detects
    vanishing under mapDomain, without a full-target surjectivity claim.
    The scope also includes
    the specified Hankel-minor
    presentation, degree-zero and degree-one boundaries, quotient-to-image
    equivalence, domain-dependent prime/spectrum results, and coefficient
    criteria for primality, reducedness, radicality and Noetherianity in every
    degree. ToricIdeals.RationalNormalCurve.Jacobson provides
    quotient_isJacobsonRing_iff: for every (R : Type u) [CommRing R] and n : ℕ,
    the full quotient Source R n ⧸ hankelIdeal R n is Jacobson if and only if R
    is Jacobson, without Noetherian, domain, field, reducedness, nontriviality
    or positive-degree hypotheses. For every (R : Type u) [CommRing R] and n : ℕ,
    quotient_isArtinianRing_iff states that the Hankel quotient is Artinian
    as a module over itself if and only if Subsingleton R. Finite nonzero
    Artinian coefficients alone do not imply an Artinian quotient.
    ToricIdeals.RationalNormalCurve.CoefficientFiniteness provides
    quotient_moduleFinite_iff: for every (R : Type u) [CommRing R] and n : ℕ,
    Module.Finite R (Source R n ⧸ hankelIdeal R n) is equivalent to
    Subsingleton R for the canonical coefficient action. This differs from
    endpointMap_finite, whose scalars are MvPolynomial (Fin 2) R.
    ToricIdeals.RationalNormalCurve.CoefficientAlgebra provides
    quotient_free, quotient_flat and quotient_faithfullyFlat: for every
    (R : Type u) [CommRing R] and n : ℕ, the full quotient
    Source R n ⧸ hankelIdeal R n is free, flat and faithfully flat for its
    canonical coefficient R-action. All coefficient universes, zero rings and
    degree zero are included, without domain, Noetherianity, nontriviality or
    positive-degree premises. In degree zero this is the full one-variable
    polynomial quotient by the bottom ideal, not the parametrization image.
    Private root-import clients directly use Mathlib's tensor injectivity iff
    and canonical unit injection for arbitrary coefficient modules in independent
    universes, with no flatness or quotient-action premise on the test modules.
    This is not freeness or flatness for the full raw-parametrization source.
    ToricIdeals.RationalNormalCurve.Augmentation characterizes the kernel of
    quotientAugmentation as the ideal spanned by all variable classes for every
    (R : Type u) [CommRing R] and n : ℕ, including degree zero and zero rings.
    Its membership criterion detects vanishing under augmentation. Quotient
    clients instantiate Mathlib's first isomorphism theorem to recover R as an
    R-algebra from the quotient by this span; the coefficient 2 in ZMod 4
    remains nonzero with square zero in every degree.
    The original Hankel ideal is homogeneous for Mathlib's canonical
    natural-number grading of the source polynomial ring for every
    (R : Type u) [CommRing R] and n : ℕ, including zero rings and n = 0, 1.
    ToricIdeals.RationalNormalCurve.HomogeneousBasis provides
    quotientHomogeneousBasis: for every (R : Type u) [CommRing R] and n d : ℕ,
    a Module.Basis (Fin (n*d+1)) R of the submodule
    (MvPolynomial.homogeneousSubmodule (Fin (n+1)) R d).map
    (Ideal.Quotient.mkₐ R (hankelIdeal R n)).toLinearMap.
    quotientHomogeneousCoordinates gives a finite-coordinate linear equivalence
    with inverse and reconstruction formulas. Positive-n representative
    coordinates are parametrization coefficients at (n*d-i,i), and the
    vectors are the original terminal source monomials. At n = 0 the basis
    vector is the class of X₀^d in the full polynomial quotient.
    All coefficient universes, zero rings, degree zero and nilpotent coefficients
    are included, without field, domain, Noetherianity or nontriviality premises.
    Root-import clients reconstruct a bivariate quadratic, verify a conic
    relation in finite coordinates and retain a nonzero square-zero coefficient
    in the five-coordinate ZMod 4 conic component.
    quotientMap_quotientHomogeneousBasis sends each indexed vector to the
    vector with the same index under the quotient homomorphism induced by any
    coefficient homomorphism R →+* S, for arbitrary commutative rings in
    independent universes and all n,d, including zero. The ideal-preservation
    witness is derived from map_hankelIdeal; no injectivity or flatness premise
    is needed. Its clients erase a nonzero coefficient-2 perturbation over
    ZMod 4 when mapping to ZMod 2, retain the scaled cubic variable class in
    the full n = 0 quotient and identify degree-zero scalar images.
    ToricIdeals.RationalNormalCurve.ExponentImage provides
    mem_mrange_rncExponent_iff: for every n : ℕ and t : Fin 2 →₀ ℕ,
    membership in AddMonoidHom.mrange (rncExponent n) is equivalent to
    n dividing t 0 + t 1. The degree-zero image is the zero exponent.
    ToricIdeals.RationalNormalCurve.MapSurjectivity provides
    rncMap_surjective_iff: for every (R : Type u) [CommSemiring R] and n : ℕ,
    Function.Surjective (rncMap R n) is equivalent to n = 1 or Subsingleton R.
    This is the raw RingHom from the full MvPolynomial (Fin (n + 1)) R to
    the full MvPolynomial (Fin 2) R, including degree zero and zero coefficients.
    Its private root-import clients reach arbitrary target polynomials over
    ZMod 1 in every degree and exclude surjectivity over ℕ in degrees zero and two.
    ToricIdeals.RationalNormalCurve.Freeness provides rncMap_moduleFree_iff:
    for every (R : Type u) [CommSemiring R] and n : ℕ, the full Target R is
    free over the full Source R n through the raw monomial parametrization
    exactly when n = 1 or Subsingleton R. Its Module argument is explicitly
    Algebra.toModule for (rncMap R n).toAlgebra, with
    p • q = rncMap R n p * q. This is arbitrary-basis freeness, not finite
    rank, coefficient-module freeness or a quotient/image statement. Degree
    zero retains the full one-variable source and sends its variable to one.
    Independent basis and collision models and separate root-import clients
    cover ℕ, ZMod 4, ZMod 1, ULift ℕ and WithTop ℕ.
    ToricIdeals.RationalNormalCurve.MapFlatness provides rncMap_flat_iff:
    for every (R : Type u) [CommRing R] and n : ℕ, (rncMap R n).Flat is
    equivalent to n = 1 or Subsingleton R. This is genuine ring-map flatness
    of the full Target R = MvPolynomial (Fin 2) R as a module over the full
    Source R n = MvPolynomial (Fin (n + 1)) R through (rncMap R n).toAlgebra,
    with p • q = rncMap R n p * q. It includes degree zero, zero rings and
    rings with zero divisors, without a domain, Noetherianity, nontriviality
    or positive-degree hypothesis. Its private root-import clients use both
    directions over zero coefficients and the nonreduced ring ZMod 4.
    ToricIdeals.RationalNormalCurve.ParametrizationFinite provides
    rncMap_finiteType and rncMap_moduleFinite_iff for every
    (R : Type u) [CommSemiring R] and n : ℕ, including zero.
    With f = rncMap R n, Algebra.FiniteType (Source R n) (Target R) holds via
    f.toAlgebra, and Module.Finite (Source R n) (Target R) via
    f.toAlgebra.toModule is equivalent to n ≠ 0 or Subsingleton R.
    Both are finite-generation properties, also for semirings; the scalar
    action uses the full Source R n, not coefficient or Hankel-quotient scalars.
    At n = 0, X₀ remains in the source but maps to 1: finite type holds,
    but module finiteness fails over nontrivial coefficients. At n = 1 the
    parametrization is an isomorphism.
    ToricIdealsTest.RationalNormalCurveExponentImageModels gives independent
    small-degree image and exclusion examples.
    ToricIdealsTest.RationalNormalCurveExponentImageClient provides
    fiberNormalExponent_normal_and_image_of_dvd: for 1 ≤ n and any target
    satisfying divisibility, fiberNormalExponent ℤ n t is Normal and maps
    back to t, with the mixed cubic family (4m+2, 2m+1) as an example.
    ToricIdeals.RationalNormalCurve.CoordinateRegularity provides
    isRegular_quotient_X: every coordinate class in the Hankel quotient is
    regular for every (R : Type u) [CommRing R], n : ℕ and i : Fin (n + 1).
    Its independent coefficient models include the zero ring, full small-degree
    polynomial quotients, nilpotent coefficients and orthogonal product constants.
    ToricIdealsTest.RationalNormalCurveCoordinateLocalization provides
    injective_algebraMap_away_quotient_X for the canonical map to the localization
    away from each coordinate class, with the same hypotheses.
    ToricIdeals.SplitQuadric provides the coordinate algebra of wz - xy = 0.
    For every (A : Type u) [CommRing A], kernel_theta and phi_injective identify
    the determinant kernel and the injective quotient parametrization.
    rangeEquiv identifies the quotient with theta.range; coordinateRing_isDomain_iff
    and relationIdeal_isPrime_iff characterize domains and prime ideals by IsDomain A.
    Coefficients have a point-evaluation retraction. The chart comparison allows
    independently chosen localization models and independent universes.
    No additional quotient grading, numerical rank over arbitrary coefficient
    rings, general classification of toric ideals or whole-source coverage
    is asserted. In particular, indexed basis data over a zero ring does not
    assert distinct basis vectors.

automation:
  methods:
    - method: "agent"
      tool_setup: >-
        AI-assisted Lean development in a pinned Lean 4 and mathlib Lake project.
  notes: >-
    AI agents developed the mathematical code and documentation. Independent
    agent review covers the Hankel presentation, exponent-image criterion and
    quotient criteria. No human-review claim is made here.

fidelity:
  divergences: >-
    Coefficientwise normalization needs neither coefficient nor exponent
    commutativity; its arbitrary-function form asserts membership of elements
    with vanishing fiber sums, not multiplicativity. Kernel equality for additive
    exponent homomorphisms separately requires the ideal to lie in the kernel.
    Coprime two-variable fiber membership and its kernel presentation concern
    the left span of X₀^a - X₁^b, not a quotient-ring construction or a
    surjection onto every natural target weight. The exponent scalars and
    target are natural numbers, independently of the coefficient ring.
    Its possibly noncommutative coefficient rings are broader than the
    polynomial and commutative-ring applications elsewhere in the library.
    The curve kernel equality generalizes the motivating example to arbitrary
    commutative coefficient rings for positive n. Domain and irreducible-spectrum
    consequences require a domain; the degree-zero equality fails for nontrivial
    rings. The all-degree coefficient criteria concern the quotient by the
    Hankel ideal itself; at degree zero this is the full one-variable
    polynomial quotient by the zero ideal, not the parametrization kernel or
    image. The Jacobson criterion includes zero rings and the full degree-zero
    and degree-one polynomial quotients; it is not a claim that Noetherian
    rings are Jacobson. Rational power-series coefficients give Noetherian but
    non-Jacobson Hankel quotients in every degree. The Artinian criterion concerns
    the quotient as a module over
    itself, not over its coefficient ring; it is equivalent to the coefficient
    ring being a zero ring, not merely Artinian. It includes nilpotent and
    product coefficients and the full degree-zero and degree-one polynomial
    quotients. Coefficient-module finiteness concerns the same full Hankel
    quotient with its canonical R-action in every degree, including degree
    zero. It needs no Noetherian coefficient-ring hypothesis and does not
    substitute endpoint-polynomial scalars or quotient self-scalars for R.
    Standard-graded homogeneity also concerns the original Hankel ideal
    in every degree: n = 0 has one source variable and ideal zero, while n = 1
    has two source variables and ideal zero. It requires no nontriviality,
    domain, field, reducedness or positive-degree assumption, and a minor's
    homogeneous degree label two does not imply total degree two for a zero
    polynomial. Homogeneous-component bases concern the stock image submodule
    in the full quotient and its canonical coefficient action, not a raw-map
    image or quotient self-action. The positive-n coordinate computation
    rescales source degree d to target degree n*d; the separate n = 0
    computation retains X₀^d. Fin (n*d+1) is the index of explicit basis data,
    not a dimension assertion over a zero ring. Coefficient change of basis
    vectors is an equality in the full quotient, not an identification of
    independently chosen terminal exponents or a claim that arbitrary
    coefficient change is injective. The exponent-image criterion has no coefficient-ring or
    positive-degree premise. The raw-map surjectivity classifier also has no
    ring, domain, Noetherianity, nontriviality or positive-degree premise.
    Degree zero sends the sole source variable to one and has constant image;
    it does not replace the full degree-zero Hankel quotient by that image.
    Raw-source freeness concerns the full bivariate target with its explicit
    module action through the raw map, over all commutative semirings and all
    degrees. It does not substitute coefficient scalars, a quotient, an image,
    endpoint coordinates or a finite-basis property. In degree one the action,
    not merely the carrier equality, is identified with self multiplication.
    Raw-map flatness concerns the full bivariate target over the full source
    through the parametrization, not coefficient-flatness of the target or
    of the Hankel quotient. The latter quotient is free and faithfully flat as
    a coefficient module in every degree, including zero rings and degree zero,
    whereas the raw map is flat exactly in degree one or for zero coefficients.
    Degree zero again sends X₀ to one, rather than retaining the quotient's
    indeterminate. The theorem concerns genuine
    commutative-ring flatness, not a classification of the broader semiring
    tensor-monomorphism-preservation property.
    The selector client requires 1 ≤ n because it
    uses the existing fiber-selection law, and specializes its inherited
    commutative coefficient-ring parameter to ℤ; it requires no supplied
    source preimage, domain or field hypothesis.
    Coordinate regularity and coordinate-localization injectivity concern the
    original Hankel quotient in every degree over any commutative ring, including
    the zero ring. They require no domain, reducedness, Noetherianity,
    nontriviality or positive-degree assumption. Degree zero again uses the full
    one-variable quotient by the bottom ideal, not the parametrization image.
    No regular-sequence, Laurent-chart or dimension formula is asserted.
    The positive-degree image equivalence is an equivalence of rings,
    not a scheme isomorphism or a classification of toric ideals.
    The split-quadric results concern wz - xy, not the degree-three rational
    normal curve. The parameter range is not identified with the entire target.
    Its exponent selector is a section only on the cone t ≤ u + v and need not
    be additive. The chart equivalence uses the scalar towers through both
    polynomial and quotient bases, whereas the backward chart morphism needs
    no scalar-tower law through the quotient. No scheme classification,
    missing-plane quotient or arbitrary-base-change naturality is asserted.

review:
  status: "agent-reviewed mathematical development"
  notes: >-
    Independent agent review covers the Hankel presentation, exponent-image
    criterion and quotient criteria, including their module and test interfaces.

acknowledgements: >-
  The project depends on mathlib without bundling it. Ravi Vakil's exercise is
  mathematical motivation and does not imply participation or endorsement.
  The Jacobson proof follows the library's Noetherian augmentation argument
  and Mathlib's Jacobson ring theory. The coefficient-module finiteness proof
  uses the library's coordinate-axis surjection and Mathlib's polynomial and
  module finiteness results. Raw-map surjectivity uses the library's exponent-image
  and coefficient-vanishing APIs together with Mathlib's Finsupp transport,
  monoid-algebra coefficient equivalence and subsingleton-target surjectivity.
  Raw-map flatness uses the library's degree-one exponent identity and
  Hankel-minor vanishing together with Mathlib's variable-selection
  equivalences, monic regularity and regular-scalar flatness theorem.
  Raw-source freeness uses the library's semiring injectivity criterion and
  degree-one map identity together with Mathlib's free-module faithfulness,
  faithful algebra-map injectivity and singleton/empty basis constructions.
  Coefficient faithful flatness uses the existing coefficient augmentation and
  freeness with Mathlib's nontrivial free-module result and transport from
  nonempty-index finitely supported functions over zero coefficients; its
  tensor clients directly reuse Mathlib's injectivity reflection and canonical
  unit injection for faithfully flat modules. Homogeneous-component bases use
  the original Hankel exponent-total identity and terminal monomial selector
  with Mathlib's coefficient algebra maps, supported monomial bases and
  finite antidiagonal equivalence; degree zero of the curve uses the full
  one-variable polynomial quotient instead of its parametrization image.
  Indexed-basis coefficient change compares the terminal representatives
  through the Hankel kernel theorem, using Mathlib's polynomial coefficient
  and quotient maps without identifying their separate choices.
  The augmentation-kernel description uses the evaluation-ideal theorem from
  multivariate-polynomials and Mathlib's ideal map/comap APIs. Its coefficient
  quotient clients use Mathlib's first isomorphism theorem for algebras.
  The Markdown adapter follows earlier
  Formal Frontier documentation tooling. Lean and doc-gen4 are separately
  credited tools, not bundled documentation or source material.
